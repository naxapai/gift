# --- GiftMarketZone PRO additions v1.5 ---

  SignalsFeedResponse:
    type: object
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/SignalItemPro"
      next_cursor:
        type: string
        nullable: true
      server_ts:
        type: string
        format: date-time

  SignalItemPro:
    type: object
    properties:
      signal_id: { type: string, format: uuid }
      ts: { type: string, format: date-time }
      action: { type: string, enum: [BUY, SELL, WATCH, SKIP] }
      strength_tag: { type: string, enum: [NONE, STRONG_BUY, STRONG_SELL], default: NONE }
      market_regime: { type: string, enum: [RISK_ON, MEAN_REVERT, RISK_OFF, PANIC] }
      market_regime_badge: { type: string, enum: ["🟢","🟡","🔴","⚠"] }
      edgeRank_profile: { type: string, enum: [BASE, RISK_ON, MEAN_REVERT, RISK_OFF, PANIC], default: BASE }
      edgeRank_raw:
        type: number
        description: |
          EdgeRank_raw (0..1) — базовый расчёт преимущества сделки без учёта доверия (Conf).

          Нормализованные компоненты (все в [0..1]):
            C  = conf_pct / 100
            S  = score100 / 100
            EP = clamp(expected_profit_pct / 0.30, 0, 1)
            L  = clamp(liquidity_score / 100, 0, 1)
            AR = clamp(absorption_30m / 2.0, 0, 1)
            D  = clamp(depth_score, 0, 1)
            LP = clamp(listing_pressure / 8.0, 0, 1)

          Динамические веса (Signals page) по режиму рынка:
            RISK_ON:     EdgeRank_raw = 0.40*EP + 0.25*S + 0.10*L + 0.10*AR + 0.05*D - 0.10*LP
            MEAN_REVERT: EdgeRank_raw = 0.35*EP + 0.25*S + 0.15*L + 0.10*AR + 0.10*D - 0.15*LP
            RISK_OFF:    EdgeRank_raw = 0.25*EP + 0.20*S + 0.20*L + 0.15*AR + 0.15*D - 0.20*LP
            PANIC:       EdgeRank_raw = 0.20*EP + 0.20*S + 0.25*L + 0.20*AR + 0.10*D - 0.25*LP

          Базовый вид (как правило MEAN_REVERT / BASE):
            EdgeRank_raw = 0.35*EP + 0.25*S + 0.15*L + 0.10*AR + 0.10*D - 0.15*LP
      edgeRank100:
        type: number
        minimum: 0
        maximum: 100
        description: |
          Итоговый EdgeRank в шкале 0..100 с учётом доверия.

          Формула:
            EdgeRank = clamp(EdgeRank_raw, 0, 1) * C
            EdgeRank100 = round(EdgeRank * 100)
      score100: { type: number, minimum: 0, maximum: 100 }
      conf_pct: { type: number, minimum: 0, maximum: 100 }
      expected_profit_pct: { type: number }
      undervalue_pct: { type: number }
      price_ton: { type: number }
      floor_ton: { type: number }
      fair_ton: { type: number }
      target_ton: { type: number, nullable: true }
      stop_ton: { type: number, nullable: true }
      liquidity_score: { type: number, nullable: true }
      absorption_30m: { type: number, nullable: true }
      listing_pressure: { type: number, nullable: true }
      volume_velocity: { type: number, nullable: true }
      depth_5pct_count: { type: integer, nullable: true }
      depth_5pct_ton: { type: number, nullable: true }
      variant_id: { type: string }
      variant_label: { type: string }
      reasons:
        type: array
        maxItems: 3
        items: { type: string }
      risk_flags:
        type: array
        maxItems: 3
        items: { type: string }
      watch_trigger: { type: string, nullable: true }
      edge_norms_summary: { type: string, nullable: true }
      edge_weights_summary: { type: string, nullable: true }
