<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Аналитика рынка Telegram-подарков</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <main class="workspace">
        <header class="topbar">
          <div class="topbar-title">
            <div class="project-brand">
              <span class="project-logo">G</span>
              <h1>GiftMarketZone</h1>
            </div>
            <p id="liveStatus" class="live-status">LIVE: подключение...</p>
          </div>
          <div class="topbar-actions">
            <input id="topSearchInput" type="search" placeholder="Поиск..." />
            <button id="refreshBtn" class="btn">Обновить</button>
          </div>
        </header>

        <section class="grid-kpi" id="kpiGrid"></section>

        <section class="card chart-card">
          <div class="card-head">
            <h2>График рынка</h2>
            <select id="giftSelect"></select>
          </div>
          <div class="chart-wrap">
            <svg id="lineChart" viewBox="0 0 1000 440" preserveAspectRatio="none"></svg>
          </div>
        </section>

        <section class="dashboard-grid">
          <div class="main-col">
            <section class="card">
              <div class="card-head">
                <h2>Обзор рынка</h2>
                <div class="filters">
                  <input id="giftSearch" type="search" placeholder="Поиск подарка..." />
                  <select id="marketFilter">
                    <option value="">Все статусы рынка</option>
                    <option value="sold">Продано</option>
                    <option value="sale">В продаже</option>
                    <option value="auction">Аукцион</option>
                  </select>
                  <select id="signalFilter">
                    <option value="">Все сигналы</option>
                    <option value="BUY">Покупка (BUY)</option>
                    <option value="SELL">Продажа (SELL)</option>
                    <option value="ANOMALY">Аномалия</option>
                    <option value="HOLD">Удержание (HOLD)</option>
                  </select>
                  <label class="fav-only-label"><input id="favoritesOnly" type="checkbox" /> Только избранное</label>
                  <select id="sortBy">
                    <option value="change_7d">Рост за 7д</option>
                    <option value="change_30d">Рост за 30д</option>
                    <option value="demand_supply_ratio">Спрос/Предложение</option>
                    <option value="volume_trend_7_vs_30">Тренд объема</option>
                    <option value="zscore_30d">Сила аномалии</option>
                  </select>
                  <select id="order">
                    <option value="desc">По убыванию</option>
                    <option value="asc">По возрастанию</option>
                  </select>
                </div>
              </div>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Название</th>
                      <th>Избр.</th>
                      <th>Цена (TON)</th>
                      <th>1d</th>
                      <th>7d</th>
                      <th>30d</th>
                      <th>D/S</th>
                      <th>Объем</th>
                      <th>Сигнал</th>
                      <th>Комментарий</th>
                    </tr>
                  </thead>
                  <tbody id="screenerBody"></tbody>
                </table>
              </div>
              <div class="pager">
                <div class="pager-left">
                  <label>Показывать
                    <select id="pageSizeSelect">
                      <option value="10">10</option>
                      <option value="25" selected>25</option>
                      <option value="50">50</option>
                      <option value="100">100</option>
                    </select>
                    строк
                  </label>
                </div>
                <div class="pager-right">
                  <button id="prevPageBtn" class="pager-btn">Назад</button>
                  <span id="pageInfo">Страница 1/1</span>
                  <button id="nextPageBtn" class="pager-btn">Вперёд</button>
                </div>
              </div>
            </section>
          </div>

          <aside class="side-col">
            <section class="card favorites-card">
              <div class="card-head">
                <h2>Избранное</h2>
              </div>
              <ul id="favoritesList"></ul>
            </section>

            <section class="card advanced-filters-card">
              <div class="card-head">
                <h2>Фильтры</h2>
              </div>
              <div class="advanced-filters-note">Для множественного выбора: удерживай Cmd/Ctrl и кликай по пунктам.</div>
              <div class="advanced-filters-grid">
                <label class="adv-field">
                  <span>Коллекция</span>
                  <select id="collectionFilter">
                    <option value="">Все коллекции</option>
                  </select>
                </label>
                <label class="adv-field">
                  <span>Модель (множественный)</span>
                  <select id="modelFilter" multiple size="7" title="Cmd/Ctrl + click">
                    <option value="">Все модели</option>
                  </select>
                </label>
                <label class="adv-field">
                  <span>Фон (множественный)</span>
                  <select id="backdropFilter" multiple size="7" title="Cmd/Ctrl + click">
                    <option value="">Все фоны</option>
                  </select>
                </label>
                <label class="adv-field">
                  <span>Узор (множественный)</span>
                  <select id="symbolFilter" multiple size="7" title="Cmd/Ctrl + click">
                    <option value="">Все узоры</option>
                  </select>
                </label>
              </div>
            </section>

            <section class="card signals">
              <div class="card-head">
                <h2>Сигналы рынка</h2>
              </div>
              <ul id="signalsList"></ul>
            </section>
          </aside>
        </section>
      </main>
    </div>

    <div id="giftModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="giftModalTitle">
      <div class="modal-backdrop" data-close="1"></div>
      <div class="modal-card">
        <button id="giftModalClose" class="modal-close" aria-label="Закрыть">×</button>
        <h3 id="giftModalTitle">Подарок</h3>
        <div id="giftModalBody" class="modal-body"></div>
      </div>
    </div>

    <script src="/assets/app.js"></script>
  </body>
</html>
