services:
  - type: web
    name: telegram-gifts-market
    env: python
    plan: free
    buildCommand: ""
    startCommand: "python3 server.py"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: VERIFIED_ONLY
        value: "true"
      - key: VERIFIED_SOURCE
        value: "fragment"
      - key: VERIFIED_REFRESH_SEC
        value: "300"
      - key: FRAGMENT_GIFTS_URL
        value: "https://fragment.com/gifts"
      - key: FRAGMENT_MAX_COLLECTIONS
        value: "0"
      - key: FRAGMENT_MAX_PAGES_PER_COLLECTION
        value: "500"
      - key: FRAGMENT_BOOTSTRAP_CACHE
        value: "true"
      - key: FRAGMENT_SERIES_MAX_POINTS
        value: "8640"
      - key: VERIFIED_API_URL
        sync: false
      - key: VERIFIED_API_TOKEN
        sync: false
      - key: VERIFIED_API_TOKEN_HEADER
        value: "Authorization"
      - key: VERIFIED_API_TOKEN_PREFIX
        value: "Bearer "
      - key: REALTIME_INTERVAL_SEC
        value: "3"
      - key: AUTH_REQUIRED
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: BOT_MIN_INTENSITY
        value: "10"
      - key: BOT_SIGNAL_INTERVAL_SEC
        value: "300"
      - key: TG_BOT_TOKEN
        sync: false
      - key: TG_CHAT_ID
        sync: false
      - key: TG_WEBHOOK_SECRET
        sync: false
