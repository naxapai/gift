services:
  - type: web
    name: telegram-gifts-market
    env: python
    plan: free
    buildCommand: "pip3 install -r requirements.txt"
    startCommand: "python3 server.py"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: VERIFIED_ONLY
        value: "true"
      - key: VERIFIED_SOURCE
        value: "telegram_api"
      - key: VERIFIED_REFRESH_SEC
        value: "300"
      - key: VERIFIED_MIN_GIFTS_ABS
        value: "200"
      - key: VERIFIED_MIN_GIFTS_RATIO
        value: "0.60"
      - key: VERIFIED_MIN_COLLECTIONS_RATIO
        value: "0.50"
      - key: VERIFIED_MIN_MODELS_RATIO
        value: "0.40"
      - key: TELEGRAM_GIFTS_API_URL
        value: "https://gift-api-bridge.onrender.com/api/gifts/verified"
      - key: TELEGRAM_GIFTS_API_TOKEN
        sync: false
      - key: BRIDGE_API_TOKEN
        sync: false
      - key: TELEGRAM_GIFTS_API_TOKEN_HEADER
        value: "Authorization"
      - key: TELEGRAM_GIFTS_API_TOKEN_PREFIX
        value: "Bearer "
      - key: TELEGRAM_GIFTS_API_TIMEOUT_SEC
        value: "25"
      - key: TELEGRAM_GIFTS_FRAGMENT_RESERVE
        value: "false"
      - key: INGEST_MAX_INFLIGHT_SEC
        value: "300"
      - key: FRAGMENT_GIFTS_URL
        value: "https://fragment.com/gifts"
      - key: FRAGMENT_MAX_COLLECTIONS
        value: "0"
      - key: FRAGMENT_MAX_PAGES_PER_COLLECTION
        value: "40"
      - key: FRAGMENT_INCLUDE_SOLD
        value: "false"
      - key: FRAGMENT_ENRICH_LOT_TRAITS
        value: "false"
      - key: FRAGMENT_FETCH_BUDGET_SEC
        value: "2200"
      - key: FRAGMENT_MIN_REQUEST_INTERVAL_SEC
        value: "0.28"
      - key: FRAGMENT_REQUEST_JITTER_SEC
        value: "0.10"
      - key: FRAGMENT_MAX_FAILED_COLLECTIONS
        value: "60"
      - key: FRAGMENT_MIN_COLLECTION_SUCCESS_RATIO
        value: "0.50"
