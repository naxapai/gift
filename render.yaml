services:
  - type: web
    name: telegram-gifts-market
    env: python
    plan: free
    buildCommand: ""
    startCommand: "python3 server.py"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: VERIFIED_ONLY
        value: "true"
      - key: VERIFIED_SOURCE
        value: "telegram_api"
      - key: VERIFIED_REFRESH_SEC
        value: "300"
      - key: VERIFIED_MIN_GIFTS_ABS
        value: "200"
      - key: VERIFIED_MIN_GIFTS_RATIO
        value: "0.60"
      - key: VERIFIED_MIN_COLLECTIONS_RATIO
        value: "0.50"
      - key: VERIFIED_MIN_MODELS_RATIO
        value: "0.40"
      - key: TELEGRAM_GIFTS_API_URL
        value: "https://gift-api-bridge.onrender.com/api/gifts/verified"
      - key: TELEGRAM_GIFTS_API_TOKEN
        sync: false
      - key: BRIDGE_API_TOKEN
        sync: false
      - key: TELEGRAM_GIFTS_API_TOKEN_HEADER
        value: "Authorization"
      - key: TELEGRAM_GIFTS_API_TOKEN_PREFIX
        value: "Bearer "
      - key: TELEGRAM_GIFTS_API_TIMEOUT_SEC
        value: "25"
      - key: TELEGRAM_GIFTS_FRAGMENT_RESERVE
        value: "false"
      - key: INGEST_MAX_INFLIGHT_SEC
        value: "300"
      - key: FRAGMENT_GIFTS_URL
        value: "https://fragment.com/gifts"
      - key: FRAGMENT_MAX_COLLECTIONS
        value: "0"
      - key: FRAGMENT_MAX_PAGES_PER_COLLECTION
        value: "40"
      - key: FRAGMENT_INCLUDE_SOLD
        value: "false"
      - key: FRAGMENT_ENRICH_LOT_TRAITS
        value: "false"
      - key: FRAGMENT_FETCH_BUDGET_SEC
        value: "2200"
      - key: FRAGMENT_MIN_REQUEST_INTERVAL_SEC
        value: "0.28"
      - key: FRAGMENT_REQUEST_JITTER_SEC
        value: "0.10"
      - key: FRAGMENT_MAX_FAILED_COLLECTIONS
        value: "60"
      - key: FRAGMENT_MIN_COLLECTION_SUCCESS_RATIO
        value: "0.50"
      - key: FRAGMENT_ALLOW_INCOMPLETE
        value: "true"
      - key: FRAGMENT_BOOTSTRAP_CACHE
        value: "false"
      - key: FRAGMENT_SERIES_MAX_POINTS
        value: "8640"
      - key: VERIFIED_API_URL
        sync: false
      - key: VERIFIED_API_TOKEN
        sync: false
      - key: VERIFIED_API_TOKEN_HEADER
        value: "Authorization"
      - key: VERIFIED_API_TOKEN_PREFIX
        value: "Bearer "
      - key: REALTIME_INTERVAL_SEC
        value: "3"
      - key: AUTH_REQUIRED
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: BOT_MIN_INTENSITY
        value: "10"
      - key: BOT_SIGNAL_INTERVAL_SEC
        value: "300"
      - key: TG_BOT_TOKEN
        sync: false
      - key: TG_CHAT_ID
        sync: false
      - key: TG_WEBHOOK_SECRET
        sync: false

  - type: web
    name: gift-api-bridge
    env: python
    plan: free
    buildCommand: ""
    startCommand: "python3 bridge_api.py"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: BRIDGE_HOST
        value: 0.0.0.0
      - key: BRIDGE_PORT
        value: "10000"
      - key: BRIDGE_REFRESH_SEC
        value: "90"
      - key: BRIDGE_API_TOKEN
        sync: false
      - key: BRIDGE_ADMIN_TOKEN
        sync: false
      - key: BRIDGE_UPSTREAM_URL
        value: "https://gift-api-upstream.onrender.com/api/gifts/verified"
      - key: BRIDGE_UPSTREAM_TOKEN
        sync: false
      - key: BRIDGE_UPSTREAM_TOKEN_HEADER
        value: "Authorization"
      - key: BRIDGE_UPSTREAM_TOKEN_PREFIX
        value: "Bearer "
      - key: BRIDGE_UPSTREAM_TIMEOUT_SEC
        value: "20"
      - key: BRIDGE_FRAGMENT_RESERVE
        value: "true"
      - key: BRIDGE_FRAGMENT_TIMEOUT_SEC
        value: "25"
      - key: FRAGMENT_GIFTS_URL
        value: "https://fragment.com/gifts"
      - key: FRAGMENT_MAX_COLLECTIONS
        value: "0"
      - key: FRAGMENT_MAX_PAGES_PER_COLLECTION
        value: "40"
      - key: FRAGMENT_INCLUDE_SOLD
        value: "false"
      - key: FRAGMENT_ENRICH_LOT_TRAITS
        value: "false"
      - key: FRAGMENT_FETCH_BUDGET_SEC
        value: "2200"
      - key: FRAGMENT_MIN_REQUEST_INTERVAL_SEC
        value: "0.28"
      - key: FRAGMENT_REQUEST_JITTER_SEC
        value: "0.10"
      - key: FRAGMENT_MAX_FAILED_COLLECTIONS
        value: "60"
      - key: FRAGMENT_MIN_COLLECTION_SUCCESS_RATIO
        value: "0.50"
      - key: FRAGMENT_ALLOW_INCOMPLETE
        value: "true"
      - key: VERIFIED_DATA_FILE
        value: "data/verified_gifts.json"
      - key: VERIFIED_API_TIMEOUT_SEC
        value: "25"
      - key: VERIFIED_MIN_GIFTS_ABS
        value: "200"
      - key: VERIFIED_MIN_GIFTS_RATIO
        value: "0.60"
      - key: VERIFIED_MIN_COLLECTIONS_RATIO
        value: "0.50"
      - key: VERIFIED_MIN_MODELS_RATIO
        value: "0.40"

  - type: web
    name: gift-api-upstream
    env: python
    plan: free
    buildCommand: ""
    startCommand: "python3 upstream_api.py"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: UPSTREAM_HOST
        value: 0.0.0.0
      - key: UPSTREAM_PORT
        value: "10000"
      - key: UPSTREAM_REFRESH_SEC
        value: "180"
      - key: UPSTREAM_API_TOKEN
        sync: false
      - key: UPSTREAM_ADMIN_TOKEN
        sync: false
      - key: UPSTREAM_FRAGMENT_TIMEOUT_SEC
        value: "25"
      - key: FRAGMENT_GIFTS_URL
        value: "https://fragment.com/gifts"
      - key: FRAGMENT_MAX_COLLECTIONS
        value: "36"
      - key: FRAGMENT_MAX_PAGES_PER_COLLECTION
        value: "12"
      - key: FRAGMENT_INCLUDE_SOLD
        value: "false"
      - key: FRAGMENT_ENRICH_LOT_TRAITS
        value: "false"
      - key: FRAGMENT_FETCH_BUDGET_SEC
        value: "900"
      - key: FRAGMENT_MIN_REQUEST_INTERVAL_SEC
        value: "0.28"
      - key: FRAGMENT_REQUEST_JITTER_SEC
        value: "0.10"
      - key: FRAGMENT_MAX_FAILED_COLLECTIONS
        value: "60"
      - key: FRAGMENT_MIN_COLLECTION_SUCCESS_RATIO
        value: "0.50"
      - key: FRAGMENT_ALLOW_INCOMPLETE
        value: "true"
      - key: VERIFIED_DATA_FILE
        value: "data/verified_gifts.json"
      - key: VERIFIED_API_TIMEOUT_SEC
        value: "25"
      - key: VERIFIED_MIN_GIFTS_ABS
        value: "200"
      - key: VERIFIED_MIN_GIFTS_RATIO
        value: "0.60"
      - key: VERIFIED_MIN_COLLECTIONS_RATIO
        value: "0.50"
      - key: VERIFIED_MIN_MODELS_RATIO
        value: "0.40"
