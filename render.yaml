services:
  - type: web
    name: telegram-gifts-market
    env: python
    plan: free
    buildCommand: ""
    startCommand: "python3 server.py"
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: VERIFIED_ONLY
        value: "true"
      - key: VERIFIED_SOURCE
        value: "fragment"
      - key: VERIFIED_REFRESH_SEC
        value: "600"
      - key: FRAGMENT_GIFTS_URL
        value: "https://fragment.com/gifts"
      - key: FRAGMENT_MAX_COLLECTIONS
        value: "0"
      - key: FRAGMENT_MAX_PAGES_PER_COLLECTION
        value: "500"
      - key: FRAGMENT_BOOTSTRAP_CACHE
        value: "true"
      - key: VERIFIED_API_URL
        sync: false
      - key: VERIFIED_API_TOKEN
        sync: false
      - key: VERIFIED_API_TOKEN_HEADER
        value: "Authorization"
      - key: VERIFIED_API_TOKEN_PREFIX
        value: "Bearer "
      - key: REALTIME_INTERVAL_SEC
        value: "3"

  - type: worker
    name: telegram-gifts-bot
    env: python
    plan: free
    buildCommand: ""
    startCommand: "python3 bot.py"
    autoDeploy: false
    envVars:
      - key: BOT_POLL_INTERVAL
        value: "300"
      - key: BOT_MIN_INTENSITY
        value: "10"
      - key: TG_BOT_TOKEN
        sync: false
      - key: TG_CHAT_ID
        sync: false
