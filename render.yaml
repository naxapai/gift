      - key: SIGNALS_BUY_CONFIDENCE
        value: "58"
      - key: SIGNALS_BUY_SCORE_BEAR
        value: "62"
      - key: SIGNALS_BUY_CONFIDENCE_BEAR
        value: "52"
      - key: TG_BOT_TOKEN
        sync: false
      - key: TG_CHAT_ID
        sync: false
      - key: TG_WEBHOOK_SECRET
        sync: false

