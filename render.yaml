  - type: cron
    name: tz-formula-gates-check
    env: python
    schedule: "*/30 * * * *"
    buildCommand: ""
    startCommand: "python3 scripts/check_tz_gates.py"
    envVars:
      - key: TZ_GATES_HORIZON_HOURS
        value: "24"
      - key: TZ_GATES_LIMIT
        value: "1000"
      - key: TZ_GATES_SIGNALS_URL
        value: "https://telegram-gifts-market.onrender.com/v1/signals"
      - key: TZ_GATES_STATUS_FILE
        value: "data/tz_gates_status.json"
      - key: TZ_GATES_BUY_MIN
        value: "1"
      - key: TZ_GATES_BUY_MAX
        value: "20"
      - key: TZ_GATES_WATCH_MIN
        value: "0"
