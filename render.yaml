        sync: false
      - key: VERIFIED_API_TOKEN_HEADER
        value: "Authorization"
      - key: VERIFIED_API_TOKEN_PREFIX
        value: "Bearer "
      - key: REALTIME_INTERVAL_SEC
        value: "3"
      - key: V1_SIGNAL_ENGINE_MODE
        value: "tz"
      - key: LISTING_PRIMARY_SOURCE
        value: "auto"
      - key: LISTING_MT_API_URL
        value: "https://gift-listing-mtproto-bridge.onrender.com/api/listings/new"
      - key: LISTING_MT_API_TOKEN
        sync: false
      - key: LISTING_MT_API_TOKEN_HEADER
        value: "Authorization"
      - key: LISTING_MT_API_TOKEN_PREFIX
        value: "Bearer "
      - key: LISTING_MT_API_TIMEOUT_SEC
        value: "8"
      - key: LISTING_MT_CACHE_TTL_SEC
        value: "2"
      - key: TZ_GATES_BUY_MIN
        value: "1"
      - key: TZ_GATES_BUY_MAX
        value: "20"
      - key: TZ_GATES_WATCH_MIN
        value: "0"
      - key: TZ_GATES_WATCH_MAX
        value: "80"
      - key: TZ_GATES_SKIP_MIN
        value: "80"
      - key: TZ_GATES_SKIP_MAX
        value: "260"
      - key: TZ_GATES_SELL_MIN
        value: "0"
      - key: TZ_GATES_SELL_MAX
        value: "20"
      - key: TZ_GATES_ALERT_BOT_TOKEN
        sync: false
      - key: TZ_GATES_ALERT_CHAT_ID
        sync: false
      - key: TZ_GATES_ALERT_COOLDOWN_SEC
        value: "7200"
      - key: AUTH_REQUIRED
        value: "false"
      - key: ADMIN_TELEGRAM_USER_ID
        sync: false
      - key: ADMIN_TELEGRAM_USER_IDS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
